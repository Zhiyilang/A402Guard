name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the eval suite (offline, stdlib only)
        run: python eval.py

      # A stray non-ASCII literal under a C locale crashes the harness rather
      # than the thing under test.  Windows ignores LC_ALL, so this is Linux
      # only.
      - name: Run under a hostile locale (LC_ALL=C, no PYTHONUTF8)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          LC_ALL: C
          LANG: C
          PYTHONIOENCODING: ascii
        run: |
          unset PYTHONUTF8
          python eval.py

      - name: End-to-end smoke against the offline mock seller
        run: python demo.py
